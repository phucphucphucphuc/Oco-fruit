
<head th:fragment="head">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- global css -->
    <link rel="stylesheet" th:href="@{/css/ui.css}">
    
    <!-- pages css -->
    <link rel="stylesheet" th:href="@{/css/home.css}" th:if="${page == 'home'}">
    <link rel="stylesheet" th:href="@{/css/about.css}" th:if="${page == 'about'}">
    <link rel="stylesheet" th:href="@{/css/price.css}" th:if="${page == 'price'}">
    <link rel="stylesheet" th:href="@{/css/order.css}" th:if="${page == 'order'}">

    <!-- icon -->
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon_io/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon_io/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon_io/favicon-16x16.png">
    <link rel="manifest" href="/favicon_io/site.webmanifest">

    <!-- font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Geist:wght@100..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Unbounded:wght@200..900&display=swap" rel="stylesheet">

    <title th:text="${title} ?: 'Oco Fruit'"></title>
</head>
