<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>

<body class="profile">
<div th:replace="~{fragments/nav :: nav}"></div>

<div class="profile-container">
    <h1>My Account</h1>

    <!-- Alert Messages -->
    <div th:if="${success}" class="success-message" th:text="${success}"></div>
    <div th:if="${error}" class="error-message" th:text="${error}"></div>

    <!-- Account Info Bar -->
    <div class="account-info">
        Account: <strong th:text="${user.username}"></strong>
        &nbsp;|&nbsp; <span th:text="${user.email}"></span>
    </div>

    <!-- Two Column Layout -->
    <div class="profile-grid">
        <!-- Delivery Information Card -->
        <div class="profile-card">
            <h2>Delivery Information</h2>
            <form th:action="@{/profile/update}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <div class="form-group">
                    <label>Fullname</label>
                    <input type="text" name="fullName" th:value="${profile.fullName}" placeholder="Nguyễn Văn A"/>
                </div>
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="text" name="phone" th:value="${profile.phone}" placeholder="0901234567"/>
                </div>
                <div class="form-group">
                    <label>Your Address</label>
                    <input type="text" name="address" th:value="${profile.address}" placeholder="123 Nguyễn Trãi, Q5"/>
                </div>
                <button type="submit" class="btn-submit">Save</button>
            </form>
        </div>

        <!-- Change Password -->
        <div class="profile-card">
            <h2>Change Password</h2>
            <form th:action="@{/profile/change-password}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <div class="form-group">
                    <label>Current Password</label>
                    <input type="password" name="currentPassword" placeholder="••••••••"/>
                </div>
                <div class="form-group">
                    <label>New Password</label>
                    <input type="password" name="newPassword" placeholder="••••••••"/>
                </div>
                <div class="form-group">
                    <label>Confirm New Password</label>
                    <input type="password" name="confirmPassword" placeholder="••••••••"/>
                </div>
                <button type="submit" class="btn-submit">Change Password</button>
            </form>
        </div>
    </div>

    <!-- Order History -->
    <div class="order-history">
        <div class="order-list">
            <h2>Order History</h2>
            <div th:if="${orders == null or orders.empty}" class="empty-orders">
                No deliveries
            </div>

            <!-- Loop -->
            <div th:each="order : ${orders}" class="order-item">
                <div>
                    <div class="order-id">#<span th:text="${order.id}"></span></div>
                    <div class="order-date"
                         th:text="${#temporals.format(order.orderDate, 'dd/MM/yyyy HH:mm')}"></div>
                    <div class="order-address" th:text="${order.address}"></div>
                </div>

                <div style="text-align:right;">
                    <div class="order-total"
                         th:text="${#numbers.formatInteger(order.totalPrice, 0, 'COMMA') + ' đ'}"></div>
                    
                    <!-- Conditional Status Badge -->
                    <span th:class="'status-badge ' + 
                          (${order.status == 'DELIVERED'} ? 'status-delivered' :
                          (${order.status == 'PENDING'} ? 'status-pending' :
                          (${order.status == 'CONFIRMED'} ? 'status-confirmed' : 'status-default')))"
                          th:text="${order.status}">
                    </span>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
