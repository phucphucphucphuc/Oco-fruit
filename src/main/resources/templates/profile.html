<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6">
<head th:replace="~{fragments/head :: head}"></head>

<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<div class="profile-container" style="max-width:900px; margin:0 auto 40px; padding:80px 20px 20px 20px;">
    <h1 style="color:rgb(80,100,20); margin-bottom:24px; font-size:32px;">👤 My Account</h1>

    <!-- Flash messages -->
    <div th:if="${success}" style="padding:12px 16px; border-radius:8px; margin-bottom:20px; background:#d1fae5; color:#065f46;" th:text="${success}"></div>
    <div th:if="${error}"   style="padding:12px 16px; border-radius:8px; margin-bottom:20px; background:#fee2e2; color:#991b1b;" th:text="${error}"></div>

    <!-- Thông tin tài khoản -->
    <div style="background:#f0fdf4; border:1px solid #bbf7d0; border-radius:8px; padding:8px 14px; font-size:0.85rem; color:#166534; margin-bottom:16px;">
        🔑 Account: <strong th:text="${user.username}"></strong>
        &nbsp;|&nbsp; 📧 <span th:text="${user.email}"></span>
    </div>

    <div style="display:grid; grid-template-columns:1fr 1fr; gap:24px;">
        <!-- Form cập nhật thông tin -->
        <div style="background:white; border-radius:12px; padding:24px; box-shadow:0 2px 8px rgba(0,0,0,0.08);">
            <h2 style="font-size:1.2rem; color:rgb(156,175,50); margin-bottom:20px; border-bottom:2px solid #e8f5e9; padding-bottom:10px;">✏️ Delivery Infomation</h2>
            <form th:action="@{/profile/update}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <div style="margin-bottom:16px;">
                    <label style="display:block; font-size:0.85rem; color:#666; margin-bottom:6px;">Fullname</label>
                    <input type="text" name="fullName" th:value="${profile.fullName}" placeholder="Nguyễn Văn A"
                           style="width:100%; padding:10px 12px; border:1px solid #ddd; border-radius:8px; font-size:0.95rem; box-sizing:border-box;"/>
                </div>
                <div style="margin-bottom:16px;">
                    <label style="display:block; font-size:0.85rem; color:#666; margin-bottom:6px;">Phone Number</label>
                    <input type="text" name="phone" th:value="${profile.phone}" placeholder="0901234567"
                           style="width:100%; padding:10px 12px; border:1px solid #ddd; border-radius:8px; font-size:0.95rem; box-sizing:border-box;"/>
                </div>
                <div style="margin-bottom:16px;">
                    <label style="display:block; font-size:0.85rem; color:#666; margin-bottom:6px;">Your Address</label>
                    <input type="text" name="address" th:value="${profile.address}" placeholder="123 Nguyễn Trãi, Q5"
                           style="width:100%; padding:10px 12px; border:1px solid #ddd; border-radius:8px; font-size:0.95rem; box-sizing:border-box;"/>
                </div>
                <button type="submit"
                        style="background:rgb(156,175,50); color:white; border:none; padding:10px 24px; border-radius:8px; cursor:pointer; font-size:0.95rem; width:100%;">
                    Save
                </button>
            </form>
        </div>

        <!-- Form đổi mật khẩu -->
        <div style="background:white; border-radius:12px; padding:24px; box-shadow:0 2px 8px rgba(0,0,0,0.08);">
            <h2 style="font-size:1.2rem; color:rgb(156,175,50); margin-bottom:20px; border-bottom:2px solid #e8f5e9; padding-bottom:10px;">🔒 Change Password</h2>
            <form th:action="@{/profile/change-password}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <div style="margin-bottom:16px;">
                    <label style="display:block; font-size:0.85rem; color:#666; margin-bottom:6px;">Current Password</label>
                    <input type="password" name="currentPassword" placeholder="••••••••"
                           style="width:100%; padding:10px 12px; border:1px solid #ddd; border-radius:8px; font-size:0.95rem; box-sizing:border-box;"/>
                </div>
                <div style="margin-bottom:16px;">
                    <label style="display:block; font-size:0.85rem; color:#666; margin-bottom:6px;">New Password</label>
                    <input type="password" name="newPassword" placeholder="••••••••"
                           style="width:100%; padding:10px 12px; border:1px solid #ddd; border-radius:8px; font-size:0.95rem; box-sizing:border-box;"/>
                </div>
                <div style="margin-bottom:16px;">
                    <label style="display:block; font-size:0.85rem; color:#666; margin-bottom:6px;">Confirm New Password</label>
                    <input type="password" name="confirmPassword" placeholder="••••••••"
                           style="width:100%; padding:10px 12px; border:1px solid #ddd; border-radius:8px; font-size:0.95rem; box-sizing:border-box;"/>
                </div>
                <button type="submit"
                        style="background:rgb(156,175,50); color:white; border:none; padding:10px 24px; border-radius:8px; cursor:pointer; font-size:0.95rem; width:100%;">
                    Change Password
                </button>
            </form>
        </div>
    </div>

    <!-- Lịch sử đơn hàng -->
    <div style="margin-top:24px;">
        <div style="background:white; border-radius:12px; padding:24px; box-shadow:0 2px 8px rgba(0,0,0,0.08);">
            <h2 style="font-size:1.2rem; color:rgb(156,175,50); margin-bottom:20px; border-bottom:2px solid #e8f5e9; padding-bottom:10px;">📦 Lịch sử đơn hàng</h2>
            <div th:if="${orders == null or orders.empty}" style="color:#999; text-align:center; padding:20px;">
                You don't have any delivery.
            </div>
            <div th:each="order : ${orders}"
                 style="background:white; border-radius:10px; padding:16px; margin-bottom:12px; box-shadow:0 1px 4px rgba(0,0,0,0.07); display:flex; justify-content:space-between; align-items:center;">
                <div>
                    <div style="font-weight:600;">#<span th:text="${order.id}"></span></div>
                    <div style="font-size:0.85rem; color:#666;"
                         th:text="${#temporals.format(order.orderDate, 'dd/MM/yyyy HH:mm')}"></div>
                    <div style="font-size:0.85rem; color:#444;" th:text="${order.address}"></div>
                </div>
                <div style="text-align:right;">
                    <div style="font-weight:700; color:rgb(156,175,50);"
                         th:text="${#numbers.formatInteger(order.totalPrice, 0, 'COMMA') + ' đ'}"></div>
                    <span th:text="${order.status}"
                          th:style="${order.status == 'DELIVERED'} ? 'background:#d1fae5;color:#065f46;padding:4px 12px;border-radius:20px;font-size:0.8rem;font-weight:600;' :
                                    (${order.status == 'PENDING'} ? 'background:#fef3c7;color:#92400e;padding:4px 12px;border-radius:20px;font-size:0.8rem;font-weight:600;' :
                                    (${order.status == 'CONFIRMED'} ? 'background:#dbeafe;color:#1e40af;padding:4px 12px;border-radius:20px;font-size:0.8rem;font-weight:600;' :
                                    'background:#fee2e2;color:#991b1b;padding:4px 12px;border-radius:20px;font-size:0.8rem;font-weight:600;'))">
                    </span>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
