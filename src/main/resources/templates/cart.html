<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>

<body class="cart">
    <div th:replace="~{fragments/nav :: nav}"></div>
    
    <main class="cart-main">
        <h1>Your Cart</h1>
        

        <div th:if="${boxes == null or boxes.isEmpty()}" class="cart-empty">
            <h3>Your cart is empty! <a th:href="@{/order}">Pick your fruits now</a></h3>
        </div>

        <div th:if="${boxes != null and !boxes.isEmpty()}" class="cart-content">

            <div class="cart-boxes">
                <div th:each="box, boxStat : ${boxes}" class="cart-box">

                    <!-- Items -->
                    <div th:each="item : ${box}" class="cart-item">
                        <img th:src="${item.product.imageUrl}" th:alt="${item.product.name}">
                        <div class="cart-item-info">
                            <strong th:text="${item.product.name}"></strong>
                            <span th:text="${#numbers.formatDecimal(item.product.price,0,'COMMA',0,'POINT')} + ' đ'"></span>
                        </div>
                        <form th:action="@{/cart/remove/{id}(id=${item.id})}" method="post">
                            <button type="submit" class="btn-remove">✕</button>
                        </form>
                    </div>
                    
                </div>
            </div>

            <!-- Summary -->
            <div class="cart-summary">
                <div class="cart-summary-row">
                    <span>Number of products:</span>
                    <span th:text="${#lists.size(boxes)}"></span>
                </div>

                <div class="cart-summary-row total-row">
                    <span>Total:</span>
                    <strong th:text="${#numbers.formatDecimal(total,0,'COMMA',0,'POINT')} + ' đ'"></strong>
                </div>

                <div class="cart-actions">
                    <form th:action="@{/cart/clear}" method="post">
                        <button type="submit" class="btn-clear">Remove all</button>
                    </form>
                    
                    <a th:href="@{/order}" class="btn-continue">+ Add more</a>
                    <a th:href="@{/checkout}" class="btn-checkout">Check Out</a>
                </div>
                
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
