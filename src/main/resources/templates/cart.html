<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>

<body class="cart">
    <div th:replace="~{fragments/nav :: nav}"></div>

    <main class="cart-main">
        <h1>Your Cart</h1>

        <div th:if="${boxes == null or boxes.isEmpty()}" class="cart-empty">
            <p>Your cart is empty! <a th:href="@{/order}">Pick your fruits now</a></p>
        </div>

        <div th:if="${boxes != null and !boxes.isEmpty()}" class="cart-content">

            <div class="cart-boxes">
                <div th:each="box, boxStat : ${boxes}" class="cart-box"
                     th:classappend="${#lists.size(box) < 3} ? ' cart-box-incomplete' : ''">

                    <!-- Header -->
                    <div class="cart-box-header">
                        <span>🧺 Box <span th:text="${boxStat.index + 1}"></span></span>
                        <span th:text="${#lists.size(box)} + ' / 3 fruits'"></span>
                    </div>

                    <!-- Warning nếu chưa đủ 3 -->
                    <div th:if="${#lists.size(box) < 3}" class="cart-box-warning">
                        ⚠️ This box needs
                        <strong th:text="${3 - #lists.size(box)}"></strong>
                        more fruit(s) to be complete.
                        <a th:href="@{/order}">Add more →</a>
                    </div>

                    <!-- Items -->
                    <div th:each="item : ${box}" class="cart-item">
                        <img th:src="${item.product.imageUrl}" th:alt="${item.product.name}">
                        <div class="cart-item-info">
                            <strong th:text="${item.product.name}"></strong>
                            <span th:text="${#numbers.formatDecimal(item.product.price,0,'COMMA',0,'POINT')} + ' đ'"></span>
                        </div>
                        <form th:action="@{/cart/remove/{id}(id=${item.id})}" method="post">
                            <button type="submit" class="btn-remove">✕</button>
                        </form>
                    </div>

                    <!-- Footer giá hộp -->
                    <div class="cart-box-footer">
                        <span>Box price:</span>
                        <strong th:if="${#lists.size(box) == 3}"
                                th:text="${#numbers.formatDecimal(
                                    #aggregates.sum(box.![product.price]),
                                    0,'COMMA',0,'POINT')} + ' đ'">
                        </strong>
                        <span th:if="${#lists.size(box) < 3}" class="incomplete-price">
                            Incomplete box
                        </span>
                    </div>
                </div>
            </div>

            <!-- Summary -->
            <div class="cart-summary">
                <div class="cart-summary-row">
                    <span>Number of boxes:</span>
                    <span th:text="${completeBoxCount} + ' box(es)'"></span>
                </div>

                <!-- Warning tổng nếu có hộp chưa đủ -->
                <div th:if="${hasIncompleteBox}" class="summary-warning">
                    ⚠️ You have incomplete box(es). Please add more fruits before checking out.
                </div>

                <div class="cart-summary-row total-row">
                    <span>Total:</span>
                    <strong th:text="${#numbers.formatDecimal(total,0,'COMMA',0,'POINT')} + ' đ'"></strong>
                </div>

                <div class="cart-actions">
                    <form th:action="@{/cart/clear}" method="post">
                        <button type="submit" class="btn-clear">Erase all</button>
                    </form>
                    <a th:href="@{/order}" class="btn-continue">+ Add more boxes</a>
                    <!-- Disable checkout nếu có hộp chưa đủ -->
                    <a th:if="${!hasIncompleteBox}" th:href="@{/checkout}" class="btn-checkout">Check Out</a>
                    <button th:if="${hasIncompleteBox}" class="btn-checkout btn-checkout-disabled" disabled>
                        Complete your boxes first
                    </button>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
