<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<div style="max-width:1100px; margin:0 auto; padding:80px 20px 40px;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:24px;">
        <h1 style="color:rgb(80,100,20);">👥 Quản lý Users</h1>
        <a th:href="@{/admin}" style="color:rgb(156,175,50); font-weight:600;">← Dashboard</a>
    </div>

    <div th:if="${success}" style="background:#d1fae5; color:#065f46; padding:12px 16px; border-radius:8px; margin-bottom:16px;" th:text="${success}"></div>

    <div style="background:white; border-radius:12px; padding:24px; box-shadow:0 2px 8px rgba(0,0,0,0.08);">
        <table style="width:100%; border-collapse:collapse; font-size:0.9rem;">
            <thead>
                <tr style="background:#f9fafb;">
                    <th style="padding:12px; text-align:left; border-bottom:2px solid #e5e7eb;">ID</th>
                    <th style="padding:12px; text-align:left; border-bottom:2px solid #e5e7eb;">Username</th>
                    <th style="padding:12px; text-align:left; border-bottom:2px solid #e5e7eb;">Email</th>
                    <th style="padding:12px; text-align:center; border-bottom:2px solid #e5e7eb;">Role</th>
                    <th style="padding:12px; text-align:center; border-bottom:2px solid #e5e7eb;">Trạng thái</th>
                    <th style="padding:12px; text-align:center; border-bottom:2px solid #e5e7eb;">Hành động</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="user : ${users}" style="border-bottom:1px solid #f3f4f6;">
                    <td style="padding:12px;" th:text="${user.id}"></td>
                    <td style="padding:12px; font-weight:600;" th:text="${user.username}"></td>
                    <td style="padding:12px; color:#666;" th:text="${user.email}"></td>
                    <td style="padding:12px; text-align:center;">
                        <form th:action="@{/admin/users/{id}/role(id=${user.id})}" method="post" style="display:inline;">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <select name="role" onchange="this.form.submit()"
                                    style="padding:4px 8px; border-radius:6px; border:1px solid #ddd; font-size:0.85rem;">
                                <option value="ROLE_USER"  th:selected="${user.role == 'ROLE_USER'}">USER</option>
                                <option value="ROLE_STAFF" th:selected="${user.role == 'ROLE_STAFF'}">STAFF</option>
                                <option value="ROLE_ADMIN" th:selected="${user.role == 'ROLE_ADMIN'}">ADMIN</option>
                            </select>
                        </form>
                    </td>
                    <td style="padding:12px; text-align:center;">
                        <span th:if="${user.enabled}"
                              style="background:#d1fae5; color:#065f46; padding:3px 10px; border-radius:20px; font-size:0.8rem;">Active</span>
                        <span th:unless="${user.enabled}"
                              style="background:#fee2e2; color:#991b1b; padding:3px 10px; border-radius:20px; font-size:0.8rem;">Disabled</span>
                    </td>
                    <td style="padding:12px; text-align:center;">
                        <form th:action="@{/admin/users/{id}/toggle(id=${user.id})}" method="post" style="display:inline;">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit"
                                    th:style="${user.enabled} ? 'background:#fee2e2; color:#991b1b; border:none; padding:5px 12px; border-radius:6px; cursor:pointer;' :
                                                               'background:#d1fae5; color:#065f46; border:none; padding:5px 12px; border-radius:6px; cursor:pointer;'"
                                    th:text="${user.enabled} ? 'Disable' : 'Enable'">
                            </button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
