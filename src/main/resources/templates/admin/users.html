<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<div style="max-width:1100px; margin:0 auto; padding:80px 20px 40px;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:24px;">
        <h1 style="color:rgb(80,100,20);">Manage Users</h1>
        <a th:href="@{/admin/dashboard}" style="color:rgb(156,175,50); font-weight:600;">← Dashboard</a>
    </div>

    <div th:if="${success}" style="background:#d1fae5; color:#065f46; padding:12px 16px; border-radius:8px; margin-bottom:16px;" th:text="${success}"></div>

    <!-- ===== ADMINS & STAFF ===== -->
    <div style="margin-bottom:32px;">
        <h2 style="color:rgb(156,175,50); font-size:1.1rem; margin-bottom:12px;">
            🛡️ Admins & Staff
            <span style="background:rgb(156,175,50); color:white; font-size:0.75rem; padding:2px 10px; border-radius:20px; margin-left:8px;"
                  th:text="${#lists.size(staffUsers)}"></span>
        </h2>
        <div style="background:white; border-radius:12px; padding:24px; box-shadow:0 2px 8px rgba(0,0,0,0.08);">
            <table style="width:100%; border-collapse:collapse; font-size:0.9rem;">
                <thead>
                    <tr style="background:#f9fafb;">
                        <th style="padding:12px; text-align:left; border-bottom:2px solid #e5e7eb;">ID</th>
                        <th style="padding:12px; text-align:left; border-bottom:2px solid #e5e7eb;">Username</th>
                        <th style="padding:12px; text-align:left; border-bottom:2px solid #e5e7eb;">Email</th>
                        <th style="padding:12px; text-align:center; border-bottom:2px solid #e5e7eb;">Role</th>
                        <th style="padding:12px; text-align:center; border-bottom:2px solid #e5e7eb;">Orders</th>
                        <th style="padding:12px; text-align:center; border-bottom:2px solid #e5e7eb;">Change Role</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="user : ${staffUsers}" style="border-bottom:1px solid #f3f4f6;">
                        <td style="padding:12px; color:#888;" th:text="${user.id}"></td>
                        <td style="padding:12px; font-weight:700;" th:text="${user.username}"></td>
                        <td style="padding:12px; color:#666;" th:text="${user.email}"></td>
                        <td style="padding:12px; text-align:center;">
                            <span th:if="${user.role == 'ROLE_ADMIN'}"
                                  style="background:#fef3c7; color:#92400e; padding:3px 12px; border-radius:20px; font-size:0.8rem; font-weight:600;">ADMIN</span>
                            <span th:if="${user.role == 'ROLE_STAFF'}"
                                  style="background:#dbeafe; color:#1e40af; padding:3px 12px; border-radius:20px; font-size:0.8rem; font-weight:600;">STAFF</span>
                        </td>
                        <td style="padding:12px; text-align:center;">
                            <a th:href="@{/admin/users/{id}/orders(id=${user.id})}"
                               style="color:rgb(156,175,50); font-weight:600; text-decoration:none; font-size:0.85rem;">
                                View Orders →
                            </a>
                        </td>
                        <td style="padding:12px; text-align:center;">
                            <form th:action="@{/admin/users/{id}/role(id=${user.id})}" method="post">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <select name="role" onchange="this.form.submit()"
                                        style="padding:4px 8px; border-radius:6px; border:1px solid #ddd; font-size:0.85rem;">
                                    <option value="ROLE_STAFF"  th:selected="${user.role == 'ROLE_STAFF'}">STAFF</option>
                                    <option value="ROLE_ADMIN"  th:selected="${user.role == 'ROLE_ADMIN'}">ADMIN</option>
                                    <option value="ROLE_USER"   th:selected="${user.role == 'ROLE_USER'}">USER (demote)</option>
                                </select>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(staffUsers)}">
                        <td colspan="6" style="padding:20px; text-align:center; color:#aaa;">No admins or staff found.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- ===== REGULAR USERS ===== -->
    <div>
        <h2 style="color:rgb(156,175,50); font-size:1.1rem; margin-bottom:12px;">
            👤 Regular Users
            <span style="background:rgb(156,175,50); color:white; font-size:0.75rem; padding:2px 10px; border-radius:20px; margin-left:8px;"
                  th:text="${#lists.size(regularUsers)}"></span>
        </h2>
        <div style="background:white; border-radius:12px; padding:24px; box-shadow:0 2px 8px rgba(0,0,0,0.08);">
            <table style="width:100%; border-collapse:collapse; font-size:0.9rem;">
                <thead>
                    <tr style="background:#f9fafb;">
                        <th style="padding:12px; text-align:left; border-bottom:2px solid #e5e7eb;">ID</th>
                        <th style="padding:12px; text-align:left; border-bottom:2px solid #e5e7eb;">Username</th>
                        <th style="padding:12px; text-align:left; border-bottom:2px solid #e5e7eb;">Email</th>
                        <th style="padding:12px; text-align:center; border-bottom:2px solid #e5e7eb;">Orders</th>
                        <th style="padding:12px; text-align:center; border-bottom:2px solid #e5e7eb;">Promote</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="user : ${regularUsers}" style="border-bottom:1px solid #f3f4f6;">
                        <td style="padding:12px; color:#888;" th:text="${user.id}"></td>
                        <td style="padding:12px; font-weight:600;" th:text="${user.username}"></td>
                        <td style="padding:12px; color:#666;" th:text="${user.email}"></td>
                        <td style="padding:12px; text-align:center;">
                            <a th:href="@{/admin/users/{id}/orders(id=${user.id})}"
                               style="color:rgb(156,175,50); font-weight:600; text-decoration:none; font-size:0.85rem;">
                                View Orders →
                            </a>
                        </td>
                        <td style="padding:12px; text-align:center;">
                            <form th:action="@{/admin/users/{id}/role(id=${user.id})}" method="post">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <input type="hidden" name="role" value="ROLE_STAFF"/>
                                <button type="submit"
                                        style="background:#dbeafe; color:#1e40af; border:none; padding:5px 14px; border-radius:6px; cursor:pointer; font-weight:600; font-size:0.85rem;">
                                    → Promote to Staff
                                </button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(regularUsers)}">
                        <td colspan="5" style="padding:20px; text-align:center; color:#aaa;">No regular users found.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
