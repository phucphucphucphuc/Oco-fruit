<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<div style="max-width:1000px; margin:0 auto; padding:80px 20px 40px;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:24px;">
        <h1 style="color:rgb(80,100,20);">
            📦 Orders of
            <span th:text="${targetUser.username}" style="color:rgb(156,175,50);"></span>
        </h1>
        <a th:href="@{/admin/users}" style="color:rgb(156,175,50); font-weight:600;">← Back to Users</a>
    </div>

    <!-- User info -->
    <div style="background:white; border-radius:12px; padding:20px 24px; box-shadow:0 2px 8px rgba(0,0,0,0.08); margin-bottom:24px; display:flex; gap:40px;">
        <div>
            <div style="color:#888; font-size:0.8rem;">Username</div>
            <div style="font-weight:700;" th:text="${targetUser.username}"></div>
        </div>
        <div>
            <div style="color:#888; font-size:0.8rem;">Email</div>
            <div th:text="${targetUser.email}"></div>
        </div>
        <div>
            <div style="color:#888; font-size:0.8rem;">Role</div>
            <div th:text="${targetUser.role}"></div>
        </div>
        <div>
            <div style="color:#888; font-size:0.8rem;">Total Orders</div>
            <div style="font-weight:700; color:rgb(156,175,50);" th:text="${#lists.size(orders)}"></div>
        </div>
    </div>

    <!-- Orders table -->
    <div style="background:white; border-radius:12px; padding:24px; box-shadow:0 2px 8px rgba(0,0,0,0.08);">
        <div th:if="${#lists.isEmpty(orders)}" style="text-align:center; padding:40px; color:#aaa;">
            This user has no orders yet.
        </div>
        <table th:unless="${#lists.isEmpty(orders)}" style="width:100%; border-collapse:collapse; font-size:0.9rem;">
            <thead>
                <tr style="background:#f9fafb;">
                    <th style="padding:12px; text-align:left; border-bottom:2px solid #e5e7eb;">#</th>
                    <th style="padding:12px; text-align:left; border-bottom:2px solid #e5e7eb;">Customer Name</th>
                    <th style="padding:12px; text-align:left; border-bottom:2px solid #e5e7eb;">Phone</th>
                    <th style="padding:12px; text-align:left; border-bottom:2px solid #e5e7eb;">Date</th>
                    <th style="padding:12px; text-align:right; border-bottom:2px solid #e5e7eb;">Total</th>
                    <th style="padding:12px; text-align:center; border-bottom:2px solid #e5e7eb;">Status</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="order : ${orders}" style="border-bottom:1px solid #f3f4f6;">
                    <td style="padding:12px; font-weight:600;" th:text="'#' + ${order.id}"></td>
                    <td style="padding:12px;" th:text="${order.customerName}"></td>
                    <td style="padding:12px; color:#666;" th:text="${order.customerPhone}"></td>
                    <td style="padding:12px; color:#666;"
                        th:text="${order.orderDate != null} ? ${#temporals.format(order.orderDate,'dd/MM/yyyy HH:mm')} : '-'"></td>
                    <td style="padding:12px; text-align:right; font-weight:600; color:rgb(156,175,50);"
                        th:text="${order.totalPrice != null} ? ${#numbers.formatInteger(order.totalPrice,0,'COMMA')} + ' đ' : '-'"></td>
                    <td style="padding:12px; text-align:center;">
                        <span th:text="${order.status}"
                              th:style="${order.status == 'DELIVERED'} ? 'background:#d1fae5;color:#065f46;padding:3px 10px;border-radius:20px;font-size:0.8rem;' :
                                        (${order.status == 'PENDING'} ? 'background:#fef3c7;color:#92400e;padding:3px 10px;border-radius:20px;font-size:0.8rem;' :
                                        (${order.status == 'CONFIRMED'} ? 'background:#dbeafe;color:#1e40af;padding:3px 10px;border-radius:20px;font-size:0.8rem;' :
                                        'background:#fee2e2;color:#991b1b;padding:3px 10px;border-radius:20px;font-size:0.8rem;'))">
                        </span>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
