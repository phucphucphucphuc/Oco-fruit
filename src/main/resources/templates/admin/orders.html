<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<div style="max-width:1100px; margin:0 auto; padding:80px 20px 40px;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:24px;">
        <h1 style="color:rgb(80,100,20);">📦 Quản lý Orders</h1>
        <a th:href="@{/admin}" style="color:rgb(156,175,50); font-weight:600;">← Dashboard</a>
    </div>

    <div th:if="${success}" style="background:#d1fae5; color:#065f46; padding:12px 16px; border-radius:8px; margin-bottom:16px;" th:text="${success}"></div>

    <!-- Filter by status -->
    <div style="display:flex; gap:10px; margin-bottom:20px; flex-wrap:wrap;">
        <a th:href="@{/admin/orders}"
           style="padding:8px 16px; border-radius:20px; text-decoration:none; font-size:0.85rem; font-weight:600;"
           th:style="${selectedStatus == null} ? 'background:rgb(156,175,50); color:white;' : 'background:white; color:#666; border:1px solid #ddd;'">
            Tất cả
        </a>
        <a th:each="s : ${ {'PENDING','CONFIRMED','DELIVERED','CANCELLED'} }"
           th:href="@{/admin/orders(status=${s})}"
           th:text="${s}"
           style="padding:8px 16px; border-radius:20px; text-decoration:none; font-size:0.85rem; font-weight:600;"
           th:style="${selectedStatus == s} ? 'background:rgb(156,175,50); color:white;' : 'background:white; color:#666; border:1px solid #ddd;'">
        </a>
    </div>

    <div style="background:white; border-radius:12px; padding:24px; box-shadow:0 2px 8px rgba(0,0,0,0.08);">
        <table style="width:100%; border-collapse:collapse; font-size:0.9rem;">
            <thead>
                <tr style="background:#f9fafb;">
                    <th style="padding:12px; text-align:left; border-bottom:2px solid #e5e7eb;">#</th>
                    <th style="padding:12px; text-align:left; border-bottom:2px solid #e5e7eb;">Khách hàng</th>
                    <th style="padding:12px; text-align:left; border-bottom:2px solid #e5e7eb;">SĐT</th>
                    <th style="padding:12px; text-align:left; border-bottom:2px solid #e5e7eb;">Ngày</th>
                    <th style="padding:12px; text-align:right; border-bottom:2px solid #e5e7eb;">Tổng</th>
                    <th style="padding:12px; text-align:center; border-bottom:2px solid #e5e7eb;">Trạng thái</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="order : ${orders}" style="border-bottom:1px solid #f3f4f6;">
                    <td style="padding:12px; font-weight:600;" th:text="'#' + ${order.id}"></td>
                    <td style="padding:12px;" th:text="${order.customerName}"></td>
                    <td style="padding:12px; color:#666;" th:text="${order.customerPhone}"></td>
                    <td style="padding:12px; color:#666;"
                        th:text="${#temporals.format(order.orderDate,'dd/MM/yyyy HH:mm')}"></td>
                    <td style="padding:12px; text-align:right; font-weight:600; color:rgb(156,175,50);"
                        th:text="${#numbers.formatInteger(order.totalPrice,0,'COMMA')} + ' đ'"></td>
                    <td style="padding:12px; text-align:center;">
                        <form th:action="@{/admin/orders/{id}/status(id=${order.id})}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <select name="status" onchange="this.form.submit()"
                                    style="padding:4px 8px; border-radius:6px; border:1px solid #ddd; font-size:0.85rem;">
                                <option value="PENDING"   th:selected="${order.status == 'PENDING'}">PENDING</option>
                                <option value="CONFIRMED" th:selected="${order.status == 'CONFIRMED'}">CONFIRMED</option>
                                <option value="DELIVERED" th:selected="${order.status == 'DELIVERED'}">DELIVERED</option>
                                <option value="CANCELLED" th:selected="${order.status == 'CANCELLED'}">CANCELLED</option>
                            </select>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
