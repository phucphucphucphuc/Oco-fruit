<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<div style="max-width:1100px; margin:0 auto; padding:80px 20px 40px;">

    <!-- Header -->
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:28px;">
        <h1 style="color:rgb(80,100,20); font-size:2rem;">📦 Manage Orders</h1>
        <a th:href="@{/admin/dashboard}" style="color:rgb(156,175,50); font-weight:600; text-decoration:none;">← Dashboard</a>
    </div>

    <!-- Success message -->
    <div th:if="${success}"
         style="background:#d1fae5; color:#065f46; padding:12px 16px; border-radius:8px; margin-bottom:20px;"
         th:text="${success}"></div>

    <!-- Filter Tabs -->
    <div style="display:flex; gap:8px; margin-bottom:24px; background:white; padding:8px; border-radius:12px; box-shadow:0 2px 8px rgba(0,0,0,0.06); width:fit-content;">
        <a th:href="@{/admin/orders}"
           th:classappend="${selectedStatus == null} ? '' : ''"
           th:style="${selectedStatus == null} ?
               'background:rgb(156,175,50); color:white; padding:8px 20px; border-radius:8px; text-decoration:none; font-weight:600; font-size:0.85rem;' :
               'color:#666; padding:8px 20px; border-radius:8px; text-decoration:none; font-size:0.85rem; font-weight:500;'">
            All
        </a>
        <a th:href="@{/admin/orders(status='PENDING')}"
           th:style="${selectedStatus == 'PENDING'} ?
               'background:#f59e0b; color:white; padding:8px 20px; border-radius:8px; text-decoration:none; font-weight:600; font-size:0.85rem;' :
               'color:#666; padding:8px 20px; border-radius:8px; text-decoration:none; font-size:0.85rem; font-weight:500;'">
            ⏳ Pending
        </a>
        <a th:href="@{/admin/orders(status='CONFIRMED')}"
           th:style="${selectedStatus == 'CONFIRMED'} ?
               'background:#3b82f6; color:white; padding:8px 20px; border-radius:8px; text-decoration:none; font-weight:600; font-size:0.85rem;' :
               'color:#666; padding:8px 20px; border-radius:8px; text-decoration:none; font-size:0.85rem; font-weight:500;'">
            ✅ Confirmed
        </a>
        <a th:href="@{/admin/orders(status='DELIVERED')}"
           th:style="${selectedStatus == 'DELIVERED'} ?
               'background:#10b981; color:white; padding:8px 20px; border-radius:8px; text-decoration:none; font-weight:600; font-size:0.85rem;' :
               'color:#666; padding:8px 20px; border-radius:8px; text-decoration:none; font-size:0.85rem; font-weight:500;'">
            🚚 Delivered
        </a>
        <a th:href="@{/admin/orders(status='CANCELLED')}"
           th:style="${selectedStatus == 'CANCELLED'} ?
               'background:#ef4444; color:white; padding:8px 20px; border-radius:8px; text-decoration:none; font-weight:600; font-size:0.85rem;' :
               'color:#666; padding:8px 20px; border-radius:8px; text-decoration:none; font-size:0.85rem; font-weight:500;'">
            ❌ Cancelled
        </a>
    </div>

    <!-- Orders count -->
    <div style="color:#888; font-size:0.85rem; margin-bottom:12px;"
         th:text="'Showing ' + ${#lists.size(orders)} + ' order(s)'"></div>

    <!-- Table -->
    <div style="background:white; border-radius:12px; overflow:hidden; box-shadow:0 2px 8px rgba(0,0,0,0.08);">
        <table style="width:100%; border-collapse:collapse; font-size:0.9rem;">
            <thead>
                <tr style="background:#f9fafb;">
                    <th style="padding:14px 16px; text-align:left; border-bottom:2px solid #e5e7eb; color:#374151;">#</th>
                    <th style="padding:14px 16px; text-align:left; border-bottom:2px solid #e5e7eb; color:#374151;">Customer</th>
                    <th style="padding:14px 16px; text-align:left; border-bottom:2px solid #e5e7eb; color:#374151;">Phone</th>
                    <th style="padding:14px 16px; text-align:left; border-bottom:2px solid #e5e7eb; color:#374151;">Address</th>
                    <th style="padding:14px 16px; text-align:left; border-bottom:2px solid #e5e7eb; color:#374151;">Date</th>
                    <th style="padding:14px 16px; text-align:right; border-bottom:2px solid #e5e7eb; color:#374151;">Total</th>
                    <th style="padding:14px 16px; text-align:center; border-bottom:2px solid #e5e7eb; color:#374151;">Status</th>
                    <th style="padding:14px 16px; text-align:center; border-bottom:2px solid #e5e7eb; color:#374151;">Action</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="order : ${orders}"
                    style="border-bottom:1px solid #f3f4f6; transition: background 0.15s;"
                    onmouseover="this.style.background='#fafafa'"
                    onmouseout="this.style.background='white'">

                    <td style="padding:14px 16px; font-weight:700; color:#374151;"
                        th:text="'#' + ${order.id}"></td>

                    <td style="padding:14px 16px; font-weight:600;"
                        th:text="${order.customerName}"></td>

                    <td style="padding:14px 16px; color:#666;"
                        th:text="${order.customerPhone}"></td>

                    <td style="padding:14px 16px; color:#666; max-width:180px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;"
                        th:text="${order.address}"></td>

                    <td style="padding:14px 16px; color:#888; font-size:0.85rem;"
                        th:text="${order.orderDate != null} ? ${#temporals.format(order.orderDate,'dd/MM/yyyy HH:mm')} : '-'"></td>

                    <td style="padding:14px 16px; text-align:right; font-weight:700; color:rgb(156,175,50);"
                        th:text="${order.totalPrice != null} ? ${#numbers.formatInteger(order.totalPrice,0,'COMMA')} + ' đ' : '-'"></td>

                    <!-- Status badge (read-only) -->
                    <td style="padding:14px 16px; text-align:center;">
                        <span th:text="${order.status}"
                              th:style="${order.status == 'DELIVERED'} ? 'background:#d1fae5; color:#065f46; padding:4px 12px; border-radius:20px; font-size:0.8rem; font-weight:600;' :
                                        (${order.status == 'PENDING'}   ? 'background:#fef3c7; color:#92400e; padding:4px 12px; border-radius:20px; font-size:0.8rem; font-weight:600;' :
                                        (${order.status == 'CONFIRMED'} ? 'background:#dbeafe; color:#1e40af; padding:4px 12px; border-radius:20px; font-size:0.8rem; font-weight:600;' :
                                        'background:#fee2e2; color:#991b1b; padding:4px 12px; border-radius:20px; font-size:0.8rem; font-weight:600;'))">
                        </span>
                    </td>

                    <!-- Action buttons -->
                    <td style="padding:14px 16px; text-align:center;">
                        <div style="display:flex; gap:6px; justify-content:center; flex-wrap:wrap;">

                            <!-- Confirm (only if PENDING) -->
                            <form th:if="${order.status == 'PENDING'}"
                                  th:action="@{/admin/orders/{id}/status(id=${order.id})}" method="post">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <input type="hidden" name="status" value="CONFIRMED"/>
                                <button type="submit"
                                        style="background:#dbeafe; color:#1e40af; border:none; padding:5px 12px; border-radius:6px; cursor:pointer; font-size:0.8rem; font-weight:600;">
                                    ✅ Confirm
                                </button>
                            </form>

                            <!-- Deliver (only if CONFIRMED) -->
                            <form th:if="${order.status == 'CONFIRMED'}"
                                  th:action="@{/admin/orders/{id}/status(id=${order.id})}" method="post">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <input type="hidden" name="status" value="DELIVERED"/>
                                <button type="submit"
                                        style="background:#d1fae5; color:#065f46; border:none; padding:5px 12px; border-radius:6px; cursor:pointer; font-size:0.8rem; font-weight:600;">
                                    🚚 Deliver
                                </button>
                            </form>

                            <!-- Cancel (only if PENDING or CONFIRMED) -->
                            <form th:if="${order.status == 'PENDING' or order.status == 'CONFIRMED'}"
                                  th:action="@{/admin/orders/{id}/status(id=${order.id})}" method="post"
                                  onsubmit="return confirm('Cancel this order?')">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <input type="hidden" name="status" value="CANCELLED"/>
                                <button type="submit"
                                        style="background:#fee2e2; color:#991b1b; border:none; padding:5px 12px; border-radius:6px; cursor:pointer; font-size:0.8rem; font-weight:600;">
                                    ❌ Cancel
                                </button>
                            </form>

                            <!-- Completed label -->
                            <span th:if="${order.status == 'DELIVERED'}"
                                  style="color:#aaa; font-size:0.8rem; font-style:italic;">Completed</span>
                            <span th:if="${order.status == 'CANCELLED'}"
                                  style="color:#aaa; font-size:0.8rem; font-style:italic;">Cancelled</span>
                        </div>
                    </td>
                </tr>

                <!-- Empty state -->
                <tr th:if="${#lists.isEmpty(orders)}">
                    <td colspan="8" style="padding:40px; text-align:center; color:#aaa;">
                        No orders found.
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
