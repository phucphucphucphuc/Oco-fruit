<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<div style="max-width:900px; margin:0 auto; padding:80px 20px 40px;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:24px;">
        <h1 style="color:rgb(80,100,20);">🏷️ Quản lý Categories</h1>
        <a th:href="@{/admin}" style="color:rgb(156,175,50); font-weight:600;">← Dashboard</a>
    </div>

    <div th:if="${success}" style="background:#d1fae5; color:#065f46; padding:12px 16px; border-radius:8px; margin-bottom:16px;" th:text="${success}"></div>

    <!-- Form thêm category -->
    <div style="background:white; border-radius:12px; padding:24px; box-shadow:0 2px 8px rgba(0,0,0,0.08); margin-bottom:24px;">
        <h2 style="color:rgb(156,175,50); margin-bottom:16px; font-size:1.1rem;">➕ Thêm Category mới</h2>
        <form th:action="@{/admin/categories/add}" method="post" style="display:flex; gap:12px; flex-wrap:wrap;">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <input type="text" name="name" placeholder="Tên category" required
                   style="flex:1; padding:10px 12px; border:1px solid #ddd; border-radius:8px; font-size:0.95rem; min-width:150px;"/>
            <input type="text" name="description" placeholder="Mô tả"
                   style="flex:2; padding:10px 12px; border:1px solid #ddd; border-radius:8px; font-size:0.95rem; min-width:200px;"/>
            <button type="submit"
                    style="background:rgb(156,175,50); color:white; border:none; padding:10px 20px; border-radius:8px; cursor:pointer; font-weight:600;">
                Thêm
            </button>
        </form>
    </div>

    <!-- Danh sách categories -->
    <div style="background:white; border-radius:12px; padding:24px; box-shadow:0 2px 8px rgba(0,0,0,0.08);">
        <table style="width:100%; border-collapse:collapse; font-size:0.9rem;">
            <thead>
                <tr style="background:#f9fafb;">
                    <th style="padding:12px; text-align:left; border-bottom:2px solid #e5e7eb;">ID</th>
                    <th style="padding:12px; text-align:left; border-bottom:2px solid #e5e7eb;">Tên</th>
                    <th style="padding:12px; text-align:left; border-bottom:2px solid #e5e7eb;">Mô tả</th>
                    <th style="padding:12px; text-align:center; border-bottom:2px solid #e5e7eb;">Hành động</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="cat : ${categories}" style="border-bottom:1px solid #f3f4f6;">
                    <td style="padding:12px;" th:text="${cat.id}"></td>
                    <td style="padding:12px; font-weight:600;" th:text="${cat.name}"></td>
                    <td style="padding:12px; color:#666;" th:text="${cat.description}"></td>
                    <td style="padding:12px; text-align:center;">
                        <form th:action="@{/admin/categories/{id}/delete(id=${cat.id})}" method="post" style="display:inline;"
                              onsubmit="return confirm('Xóa category này?')">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit"
                                    style="background:#fee2e2; color:#991b1b; border:none; padding:5px 12px; border-radius:6px; cursor:pointer;">
                                Xóa
                            </button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
