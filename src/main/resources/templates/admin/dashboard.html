<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>

<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<div style="max-width:1200px; margin:0 auto; padding:80px 20px 40px;">
    <h1 style="color:rgb(80,100,20); margin-bottom:32px;">Admin Dashboard</h1>

    <!-- Stat Cards -->
    <div style="display:grid; grid-template-columns:repeat(4,1fr); gap:20px; margin-bottom:40px;">
        <div style="background:white; border-radius:12px; padding:24px; box-shadow:0 2px 8px rgba(0,0,0,0.08); text-align:center;">
            <div style="font-size:2rem;">👥</div>
            <div style="font-size:2rem; font-weight:700; color:rgb(156,175,50);" th:text="${totalUsers}"></div>
            <div style="color:#666; font-size:0.9rem;">Total Users</div>
        </div>
        <div style="background:white; border-radius:12px; padding:24px; box-shadow:0 2px 8px rgba(0,0,0,0.08); text-align:center;">
            <div style="font-size:2rem;">📦</div>
            <div style="font-size:2rem; font-weight:700; color:rgb(156,175,50);" th:text="${totalOrders}"></div>
            <div style="color:#666; font-size:0.9rem;">Total Orders</div>
        </div>
        <div style="background:white; border-radius:12px; padding:24px; box-shadow:0 2px 8px rgba(0,0,0,0.08); text-align:center;">
            <div style="font-size:2rem;">⏳</div>
            <div style="font-size:2rem; font-weight:700; color:#f59e0b;" th:text="${pendingOrders}"></div>
            <div style="color:#666; font-size:0.9rem;">Pending Orders</div>
        </div>
        <div style="background:white; border-radius:12px; padding:24px; box-shadow:0 2px 8px rgba(0,0,0,0.08); text-align:center;">
            <div style="font-size:2rem;">💰</div>
            <div style="font-size:1.4rem; font-weight:700; color:rgb(156,175,50);"
                 th:text="${#numbers.formatInteger(totalRevenue,0,'COMMA')} + ' đ'"></div>
            <div style="color:#666; font-size:0.9rem;">Total Revenue</div>
        </div>
    </div>

    <!-- Quick Links -->
    <div style="display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-bottom:40px;">
        <a th:href="@{/admin/users}" style="background:rgb(156,175,50); color:white; padding:16px; border-radius:12px; text-align:center; text-decoration:none; font-weight:600;">👥 Manage Users</a>
        <a th:href="@{/admin/orders}" style="background:rgb(156,175,50); color:white; padding:16px; border-radius:12px; text-align:center; text-decoration:none; font-weight:600;">📦 Manage Orders</a>
        <a th:href="@{/admin/products}" style="background:rgb(156,175,50); color:white; padding:16px; border-radius:12px; text-align:center; text-decoration:none; font-weight:600;">🏷️ Products and Categories</a>
    </div>

    <!-- Charts Row -->
    <div style="display:grid; grid-template-columns:2fr 1fr; gap:24px; margin-bottom:40px;">

        <!-- Line Chart: Revenue 7 days -->
        <div style="background:white; border-radius:12px; padding:24px; box-shadow:0 2px 8px rgba(0,0,0,0.08);">
            <h2 style="color:rgb(156,175,50); margin-bottom:16px; font-size:1.1rem;">📈 Revenue - Last 7 Days</h2>
            <canvas id="revenueChart" height="120"></canvas>
        </div>

        <!-- Doughnut Chart: Order Status -->
        <div style="background:white; border-radius:12px; padding:24px; box-shadow:0 2px 8px rgba(0,0,0,0.08);">
            <h2 style="color:rgb(156,175,50); margin-bottom:16px; font-size:1.1rem;">🍩 Orders by Status</h2>
            <canvas id="statusChart" height="160"></canvas>
        </div>
    </div>

    <!-- Bar Chart: Top Products -->
    <div style="background:white; border-radius:12px; padding:24px; box-shadow:0 2px 8px rgba(0,0,0,0.08); margin-bottom:40px;">
        <h2 style="color:rgb(156,175,50); margin-bottom:16px; font-size:1.1rem;">🏆 Top 5 Best-Selling Fruits</h2>
        <canvas id="productChart" height="80"></canvas>
    </div>

    <!-- Recent Orders Table -->
    <div style="background:white; border-radius:12px; padding:24px; box-shadow:0 2px 8px rgba(0,0,0,0.08);">
        <h2 style="color:rgb(156,175,50); margin-bottom:16px; font-size:1.2rem;">🕐 Recent Orders</h2>
        <table style="width:100%; border-collapse:collapse; font-size:0.9rem;">
            <thead>
                <tr style="background:#f9fafb;">
                    <th style="padding:10px; text-align:left; border-bottom:2px solid #e5e7eb;">#</th>
                    <th style="padding:10px; text-align:left; border-bottom:2px solid #e5e7eb;">Customer</th>
                    <th style="padding:10px; text-align:left; border-bottom:2px solid #e5e7eb;">Date</th>
                    <th style="padding:10px; text-align:right; border-bottom:2px solid #e5e7eb;">Total</th>
                    <th style="padding:10px; text-align:center; border-bottom:2px solid #e5e7eb;">Status</th>
                    <th style="padding:10px; text-align:center; border-bottom:2px solid #e5e7eb;">Action</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="order : ${recentOrders}" style="border-bottom:1px solid #f3f4f6;">
                    <td style="padding:10px;" th:text="'#' + ${order.id}"></td>
                    <td style="padding:10px;" th:text="${order.customerName}"></td>
                    <td style="padding:10px; color:#666;"
                        th:text="${order.orderDate != null} ? ${#temporals.format(order.orderDate,'dd/MM/yyyy')} : '-'"></td>
                    <td style="padding:10px; text-align:right; font-weight:600; color:rgb(156,175,50);"
                        th:text="${order.totalPrice != null} ? ${#numbers.formatInteger(order.totalPrice,0,'COMMA')} + ' đ' : '-'"></td>
                    <td style="padding:10px; text-align:center;">
                        <span th:text="${order.status}"
                              th:style="${order.status == 'DELIVERED'} ? 'background:#d1fae5;color:#065f46;padding:3px 10px;border-radius:20px;font-size:0.8rem;' :
                                        (${order.status == 'PENDING'} ? 'background:#fef3c7;color:#92400e;padding:3px 10px;border-radius:20px;font-size:0.8rem;' :
                                        (${order.status == 'CONFIRMED'} ? 'background:#dbeafe;color:#1e40af;padding:3px 10px;border-radius:20px;font-size:0.8rem;' :
                                        'background:#fee2e2;color:#991b1b;padding:3px 10px;border-radius:20px;font-size:0.8rem;'))">
                        </span>
                    </td>
                    <td style="padding:10px; text-align:center;">
                        <a th:href="@{/admin/orders}" style="color:rgb(156,175,50); font-size:0.85rem; text-decoration:none; font-weight:600;">View →</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script th:inline="javascript">
    const days = /*[[${chartDays}]]*/ [];
    const revenue = /*[[${chartRevenue}]]*/ [];
    const statusLabels = /*[[${statusLabels}]]*/ [];
    const statusCounts = /*[[${statusCounts}]]*/ [];
    const productNames = /*[[${topProductNames}]]*/ [];
    const productCounts = /*[[${topProductCounts}]]*/ [];

    // Line Chart - Revenue
    new Chart(document.getElementById('revenueChart'), {
        type: 'line',
        data: {
            labels: days,
            datasets: [{
                label: 'Revenue (đ)',
                data: revenue,
                borderColor: 'rgb(156,175,50)',
                backgroundColor: 'rgba(156,175,50,0.1)',
                borderWidth: 3,
                fill: true,
                tension: 0.4,
                pointBackgroundColor: 'rgb(156,175,50)',
                pointRadius: 5
            }]
        },
        options: {
            responsive: true,
            plugins: { legend: { display: false } },
            scales: {
                y: {
                    beginAtZero: true,
                    ticks: {
                        callback: val => val.toLocaleString('vi-VN') + 'đ'
                    }
                }
            }
        }
    });

    // Doughnut Chart - Status
    new Chart(document.getElementById('statusChart'), {
        type: 'doughnut',
        data: {
            labels: statusLabels,
            datasets: [{
                data: statusCounts,
                backgroundColor: ['#fef3c7', '#dbeafe', '#d1fae5', '#fee2e2'],
                borderColor: ['#f59e0b', '#3b82f6', '#10b981', '#ef4444'],
                borderWidth: 2
            }]
        },
        options: {
            responsive: true,
            plugins: {
                legend: { position: 'bottom', labels: { font: { size: 12 } } }
            }
        }
    });

    // Bar Chart - Top Products
    new Chart(document.getElementById('productChart'), {
        type: 'bar',
        data: {
            labels: productNames,
            datasets: [{
                label: 'Times Ordered',
                data: productCounts,
                backgroundColor: 'rgba(156,175,50,0.7)',
                borderColor: 'rgb(156,175,50)',
                borderWidth: 2,
                borderRadius: 8
            }]
        },
        options: {
            responsive: true,
            plugins: { legend: { display: false } },
            scales: {
                y: { beginAtZero: true, ticks: { stepSize: 1 } }
            }
        }
    });
</script>
</body>
</html>
