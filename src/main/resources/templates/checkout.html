<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>

<body>
    <div th:replace="~{fragments/nav :: nav}"></div>
    <main class="checkout">
        <h1>Check Out</h1>
        
        <div class="checkout-main">
            <!-- customer in4 -->
            <div class="checkout-left">
                <h2 style="color: black;">Customer Information</h2>
                <form th:action="@{/checkout}" method="post" id="checkoutForm">
                    <div class="checkout-field">
                        <label>Full Name</label>
                        <input type="text" name="customerName" placeholder="Nguyen Van A" required>
                    </div>
                    <br>
                    <div class="checkout-field">
                        <label>Email</label>
                        <input type="email" name="email" placeholder="email@example.com" required>
                    </div>
                    <br>
                    <div class="checkout-field">
                        <label>Phone Number</label>
                        <input type="tel" name="customerPhone" placeholder="+84..." required>
                    </div>
                    <br>
                    <div class="checkout-field">
                        <label>Address</label>
                        <input type="text" name="address" placeholder="House number, street name" required>
                    </div>
                    <br>
                    <div class="checkout-field">
                        <label>Note</label>
                        <textarea name="note" placeholder="Additional notes..."></textarea>
                    </div>
                    <br>

                    <!-- Payment method -->
                    <h3 class="checkout-section-title">Payment Method</h3>
                    <br>
                    <div class="payment-options">
                        <label class="payment-option">
                            <input type="radio" name="paymentMethod" value="COD" checked>
                            <div class="payment-option-content">
                                <div class="payment-icon">🚚</div>
                                <div>
                                    <strong>Cash on Delivery (COD)</strong>
                                    <p>Pay in cash when receiving your order</p>
                                </div>
                            </div>
                        </label>
                        <label class="payment-option">
                            <input type="radio" name="paymentMethod" value="TRANSFER">
                            <div class="payment-option-content">
                                <div class="payment-icon">🏦</div>
                                <div>
                                    <strong>Bank Transfer</strong>
                                    <p>Transfer to our bank account before delivery</p>
                                </div>
                            </div>
                        </label>
                    </div>
                    <br>
                    
                    <button type="submit" class="btn-place-order">Place Order</button>
                </form>
            </div>
            <!-- order sum -->
            <div class="checkout-right">
                <h2 style="color: black;">Order Summary</h2>
                <div class="checkout-summary-box">
                    <!-- Header -->
                    <div class="checkout-summary-header">
                        <span>Product</span>
                        <span>Price</span>
                    </div>
                    <!-- prodcuts summary -->
                    <div th:each="box, boxStat : ${boxes}" class="checkout-summary-box-row">
                        <div class="checkout-item-row">
                            <div class="checkout-item-name">
                                <img th:src="${box[0].product.imageUrl}" th:alt="${box[0].product.name}">
                                <span th:text="${box[0].product.name}"></span>
                            </div>
                            <span th:text="${#numbers.formatDecimal(box[0].product.price,0,'COMMA',0,'POINT')} + ' đ'"></span>
                        </div>
                    </div>
                    <!-- sum -->
                    <div class="checkout-total">
                        <span>Total</span>
                        <strong th:text="${#numbers.formatDecimal(total,0,'COMMA',0,'POINT')} + ' đ'"></strong>
                    </div>
                </div>
            </div>
        </div>

    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
