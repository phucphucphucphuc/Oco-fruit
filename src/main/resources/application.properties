# ========================== SERVER ==========================
server.port=${PORT:8080}

# ========================== DATABASE ==========================
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/oco_fruit_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:mingquan}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# reCAPTCHA
recaptcha.secret=${RECAPTCHA_SECRET:6LdKWgUtAAAAANSBnuC0mhzFTcgj9K_oZm6DAojD}

# File upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.upload.dir=${UPLOAD_DIR:src/main/resources/static/assets/products}